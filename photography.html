      #photography-content {
        margin: 50px auto;

        padding: 0 24px;
      }

      #photography-content h1 {
        position: static;
        margin: 0 0 28px;
        padding: 0;
      }

      .photo-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .photo-gallery a {
        display: block;
        aspect-ratio: 4 / 3;
        overflow: hidden;
      }

      .photo-gallery img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.2s ease;
      }

      .photo-gallery a:hover img {
        transform: scale(1.04);
      }
